# GameTest isolation only: manual native tree fixtures do not need chunk decoration.
# Avoid racing upstream DT biome database reload against asynchronous world generation.
# This file is outside main resources and is never shipped in the mod JAR.
[world]
worldGen = false

# Match the pack's real growth cadence; normalization tests inspect these live native values.
[trees]
growthMultiplier = 0.5
growthFolding = 2
